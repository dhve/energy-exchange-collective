name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  collective:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r deploy/collective/requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -p 'test_collective*.py' -v
      - run: node --test tests/test_collective_ui.cjs tests/collective_streamlit_bridge.test.js
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx==0.28.1
      - run: python -m unittest tests.test_network tests.test_server tests.test_streamlit -v
